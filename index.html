<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mad Libs Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #ffd1ff 50%, #a1c4fd 75%, #c2e9fb 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 650px;
            width: 100%;
            border: 6px solid #ff70a6;
        }
        h1 {
            font-family: 'Fredoka', sans-serif;
            color: #ff3366;
            text-align: center;
            font-size: 36px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px #ffe3e3;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group.full {
            grid-column: span 2;
        }
        label {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            margin-bottom: 6px;
            color: #4a5568;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #cbd5e1;
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: #1e293b;
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #33cc33;
            background: #fff;
            outline: none;
            box-shadow: 0 0 10px rgba(51, 204, 51, 0.3);
        }
        .output-box {
            background: #f0fdf4;
            border: 4px dashed #22c55e;
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
            font-size: 22px;
            line-height: 1.6;
            color: #1e293b;
            text-align: center;
        }
        .highlight {
            color: #e11d48;
            font-weight: 700;
            background: #ffe4e6;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .math-question {
            font-family: 'Fredoka', sans-serif;
            color: #0284c7;
            margin-top: 15px;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Math Mad Libs Generator</h1>
    
    <div class="input-grid">
        <div class="input-group full">
            <label for="name">Character Name:</label>
            <input type="text" id="name" placeholder="e.g., Jerry" oninput="updateProblem()">
        </div>

        <div class="input-group">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" placeholder="e.g., 5" oninput="updateProblem()">
        </div>

        <div class="input-group">
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" placeholder="e.g., 6" oninput="updateProblem()">
        </div>

        <div class="input-group full">
            <label for="object">Object / Item:</label>
            <input type="text" id="object" placeholder="e.g., roses" oninput="updateProblem()">
        </div>
    </div>

    <div class="output-box" id="output">
        Type your details above to create your custom math word problem.
    </div>
</div>

<script>
    function updateProblem() {
        let name = document.getElementById('name').value || "[Name]";
        let num1 = document.getElementById('num1').value || "[#1]";
        let num2 = document.getElementById('num2').value || "[#2]";
        let obj = document.getElementById('object').value || "[Object]";

        let outputDiv = document.getElementById('output');
        outputDiv.innerHTML = `
            <span class="highlight">${name}</span> bought <span class="highlight">${num1}</span> <span class="highlight">${obj}</span> at the store. Before leaving, they bought <span class="highlight">${num2}</span> more <span class="highlight">${obj}</span>.
            <div class="math-question">How many did they get in all?</div>
        `;
    }
</script>

</body>
</html>
