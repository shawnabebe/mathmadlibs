<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Mad Libs! 🧸🔢</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            /* Blue wooden planks background effect */
            background-color: #2a839e;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.1) 0%, transparent 5%, transparent 95%, rgba(0,0,0,0.1) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 45px, rgba(0,0,0,0.15) 45px, rgba(0,0,0,0.15) 50px),
                linear-gradient(135deg, #329bb8 0%, #1f6b82 100%);
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 100%;
            border: 6px solid #ffd166; /* Bright toy yellow border */
            position: relative;
        }
        h1 {
            font-family: 'Fredoka', sans-serif;
            color: #ef476f; /* Toy red */
            text-align: center;
            font-size: 36px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px #ffe6ed;
        }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group.full {
            grid-column: span 2;
        }
        label {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            margin-bottom: 6px;
            color: #118ab2; /* Toy blue */
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: #073b4c;
            box-sizing: border-box;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #06d6a0; /* Toy green */
            background: #fff;
            outline: none;
            box-shadow: 0 0 10px rgba(6, 214, 160, 0.4);
        }
        .output-box {
            background: #f1f5f9;
            border: 4px dashed #06d6a0; /* Toy green dashed border */
            padding: 25px;
            border-radius: 20px;
            margin-top: 25px;
            font-size: 22px;
            line-height: 1.6;
            color: #073b4c;
            text-align: center;
        }
        .highlight {
            color: #ef476f;
            font-weight: 700;
            background: #ffe3e9;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .math-question {
            font-family: 'Fredoka', sans-serif;
            color: #118ab2;
            margin-top: 15px;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧸 Math Mad Libs Generator! 🚂</h1>
    
    <div class="input-grid">
        <div class="input-group full">
            <label for="name">👤 Character Name:</label>
            <input type="text" id="name" placeholder="e.g., Jerry" oninput="updateProblem()">
        </div>

        <div class="input-group">
            <label for="num1">🔢 First Number:</label>
            <input type="number" id="num1" placeholder="e.g., 5" oninput="updateProblem()">
        </div>

        <div class="input-group">
            <label for="num2">🔢 Second Number:</label>
            <input type="number" id="num2" placeholder="e.g., 6" oninput="updateProblem()">
        </div>

        <div class="input-group full">
            <label for="object">🍎 Object / Item:</label>
            <input type="text" id="object" placeholder="e.g., roses" oninput="updateProblem()">
        </div>
    </div>

    <div class="output-box" id="output">
        Type your details above to create your custom math word problem! ✨
    </div>
</div>

<script>
    function updateProblem() {
        let name = document.getElementById('name').value || "[Name]";
        let num1 = document.getElementById('num1').value || "[#1]";
        let num2 = document.getElementById('num2').value || "[#2]";
        let obj = document.getElementById('object').value || "[Object]";

        let outputDiv = document.getElementById('output');
        outputDiv.innerHTML = `
            <span class="highlight">${name}</span> bought <span class="highlight">${num1}</span> <span class="highlight">${obj}</span> at the store. Before leaving, they bought <span class="highlight">${num2}</span> more <span class="highlight">${obj}</span>.
            <div class="math-question">❓ How many did they get in all?</div>
        `;
    }
</script>

</body>
</html>

</body>
</html>
