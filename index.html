<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs Math Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        .output-box {
            background: #eef2f7;
            border-left: 5px solid #4a90e2;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.5;
        }
        .math-question {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Math Mad Libs!</h1>
    
    <div class="input-group">
        <label for="name">Character Name:</label>
        <input type="text" id="name" placeholder="e.g., Jerry" oninput="updateProblem()">
    </div>

    <div class="input-group">
        <label for="num1">First Number:</label>
        <input type="number" id="num1" placeholder="e.g., 5" oninput="updateProblem()">
    </div>

    <div class="input-group">
        <label for="num2">Second Number:</label>
        <input type="number" id="num2" placeholder="e.g., 6" oninput="updateProblem()">
    </div>

    <div class="input-group">
        <label for="object">Object / Item:</label>
        <input type="text" id="object" placeholder="e.g., roses" oninput="updateProblem()">
    </div>

    <div class="output-box" id="output">
        Type your details above to create your custom math word problem!
    </div>
</div>

<script>
    function updateProblem() {
        let name = document.getElementById('name').value || "[Name]";
        let num1 = document.getElementById('num1').value || "[Number 1]";
        let num2 = document.getElementById('num2').value || "[Number 2]";
        let obj = document.getElementById('object').value || "[Object]";

        let outputDiv = document.getElementById('output');
        outputDiv.innerHTML = `
            ${name} bought ${num1} ${obj} at the store. Before leaving, they bought ${num2} more ${obj}.
            <div class="math-question">❓ How many did they get in all?</div>
        `;
    }
</script>

</body>
</html>
